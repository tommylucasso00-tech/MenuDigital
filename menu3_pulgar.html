<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menú digital personalizado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4efe8;
  --bg-2:#efe3d3;
  --surface:rgba(255,255,255,.88);
  --surface-strong:rgba(255,255,255,.95);
  --ink:#24160f;
  --muted:#7a6559;
  --line:rgba(71,42,23,.12);
  --accent:#7a4b2e;
  --accent-2:#b47349;
  --on-accent:#fffaf6;
  --shadow:0 18px 44px rgba(52,31,20,.14);
  color-scheme:light;
}
:root[data-estilo="oscuro"]{
  --bg:#171211;
  --bg-2:#251917;
  --surface:rgba(31,24,23,.86);
  --surface-strong:rgba(34,26,24,.95);
  --ink:#f7f1ed;
  --muted:#d2beb0;
  --line:rgba(250,235,225,.12);
  --shadow:0 18px 48px rgba(0,0,0,.38);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{min-height:100%}
body{
  margin:0;min-height:100vh;position:relative;isolation:isolate;
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:linear-gradient(180deg,var(--bg),var(--bg-2));
  color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.wallpaper{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.wallpaper::before,.wallpaper::after{content:"";position:absolute;border-radius:50%;filter:blur(12px);opacity:.55}
.wallpaper::before{width:290px;height:290px;left:-90px;top:-45px;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.95),rgba(255,255,255,0) 70%)}
.wallpaper::after{width:310px;height:310px;right:-110px;top:130px;background:radial-gradient(circle at 50% 50%,rgba(183,132,92,.20),rgba(183,132,92,0) 68%)}
.wallpaper-art{position:absolute;inset:0;background-image:
radial-gradient(circle at 15% 10%, rgba(255,255,255,.34), transparent 25%),
radial-gradient(circle at 85% 15%, rgba(194,142,97,.18), transparent 24%),
radial-gradient(circle at 78% 85%, rgba(122,75,46,.10), transparent 22%);
background-repeat:no-repeat}
:root[data-estilo="oscuro"] .wallpaper-art{background-image:
radial-gradient(circle at 15% 10%, rgba(255,255,255,.08), transparent 25%),
radial-gradient(circle at 85% 15%, rgba(194,142,97,.12), transparent 24%),
radial-gradient(circle at 78% 85%, rgba(122,75,46,.12), transparent 22%)}
.cafe-lienzo{position:fixed;top:0;left:0;z-index:0;display:block;width:100vw;height:100vh;pointer-events:none;transform:translate3d(0,0,0);backface-visibility:hidden;-webkit-backface-visibility:hidden}
@media(prefers-reduced-motion:reduce){.cafe-lienzo{display:none!important}}
.wash{position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,251,248,.18),rgba(255,247,239,.34) 58%,rgba(247,238,231,.58) 100%)}
:root[data-estilo="oscuro"] .wash{background:linear-gradient(180deg,rgba(8,5,5,.22),rgba(9,7,6,.48))}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:24px 18px calc(110px + env(safe-area-inset-bottom));}
.hero,.sheet,.thumb-zone,.section-card{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.hero{position:relative;overflow:hidden;border-radius:30px 30px 34px 26px;padding:18px 18px 20px}
.hero::before{content:"";position:absolute;inset:auto 18px 0;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.hero-head{display:flex;align-items:center;gap:14px}
.logo{width:82px;height:82px;flex:none;border-radius:28px 28px 22px 28px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 76%, #f0c299));color:var(--on-accent);display:grid;place-items:center;overflow:hidden;font-size:32px;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 10px 22px rgba(0,0,0,.12)}
.logo img{width:100%;height:100%;object-fit:cover}
.hero-copy{min-width:0;flex:1}
.badge-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.badge{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:rgba(122,75,46,.10);border:1px solid rgba(122,75,46,.13);font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(122,75,46,.11)}
h1{margin:0;font-size:clamp(28px,8vw,38px);line-height:1.02;letter-spacing:-.05em;overflow-wrap:anywhere}
.desc{margin:10px 0 0;font-size:14px;color:var(--muted);white-space:pre-line;line-height:1.62}
.oferta-link{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:15px 16px 15px 18px;border-radius:24px 24px 18px 26px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border:1px solid rgba(255,255,255,.22);box-shadow:0 14px 30px rgba(73,39,21,.18), inset 0 1px 0 rgba(255,255,255,.3);min-height:78px}
.oferta-link::after{content:"›";display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);font-size:28px;font-weight:700;line-height:1}
.oferta-copy{min-width:0}
.oferta-kicker{display:block;font-size:11px;font-weight:800;letter-spacing:.16em;opacity:.8;margin-bottom:4px}
.oferta-titulo{display:block;font-size:17px;font-weight:800;line-height:1.18;overflow-wrap:anywhere}
.thumb-zone{margin-top:16px;padding:14px;border-radius:30px 22px 34px 22px;background:linear-gradient(180deg,var(--surface-strong),var(--surface));}
.thumb-zone-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 4px 14px}
.thumb-zone-head h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.02em}
.thumb-zone-note{font-size:11px;color:var(--muted);font-weight:700}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.action-btn{position:relative;display:flex;align-items:center;gap:12px;min-width:0;min-height:76px;padding:14px 16px;border-radius:28px 22px 30px 20px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(255,255,255,.72));box-shadow:0 10px 22px rgba(0,0,0,.06);transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease}
:root[data-estilo="oscuro"] .action-btn{background:linear-gradient(180deg,rgba(54,43,39,.82),rgba(35,28,26,.88))}
.action-btn:hover{transform:translateY(-2px);box-shadow:0 15px 28px rgba(0,0,0,.10);border-color:color-mix(in srgb,var(--accent) 40%, var(--line))}
.action-btn:active{transform:scale(.985)}
.action-btn.main{grid-column:1 / -1;min-height:92px;padding:18px 18px 18px 20px;border-radius:34px 24px 38px 24px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border-color:transparent;box-shadow:0 16px 30px rgba(108,63,36,.26), inset 0 1px 0 rgba(255,255,255,.26)}
.action-btn.big-alone{grid-column:1 / -1}
.action-orb{width:48px;height:48px;flex:none;border-radius:21px 19px 23px 18px;display:grid;place-items:center;background:rgba(122,75,46,.10);border:1px solid rgba(122,75,46,.12)}
.action-btn.main .action-orb{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.22)}
.action-orb svg{width:22px;height:22px;display:block}
.action-copy{min-width:0;flex:1}
.action-title{display:block;font-size:16px;font-weight:800;letter-spacing:-.03em;overflow-wrap:anywhere}
.action-sub{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:4px}
.action-btn.main .action-sub{color:rgba(255,255,255,.82)}
.action-arrow{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(122,75,46,.10);border:1px solid rgba(122,75,46,.12);font-size:23px;font-weight:700;line-height:1}
.action-btn.main .action-arrow{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22)}
.sheet{margin-top:16px;padding:18px;border-radius:28px 22px 30px 22px}
.sheet h3{margin:0 0 4px;font-size:18px;font-weight:800;letter-spacing:-.03em}
.sheet .lead{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.social-grid{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.social-btn{display:flex;align-items:center;gap:13px;min-width:0;padding:13px 15px;border-radius:26px 22px 28px 18px;border:1px solid var(--line);background:rgba(255,255,255,.62);box-shadow:0 8px 18px rgba(0,0,0,.04);font-weight:800}
:root[data-estilo="oscuro"] .social-btn{background:rgba(43,34,32,.72)}
.social-symbol{width:40px;height:40px;min-width:40px;display:grid;place-items:center;border-radius:15px 14px 16px 12px;background:#ece8e5;overflow:hidden}
.social-symbol svg{width:24px;height:24px;display:block}
.social-symbol.instagram{background:linear-gradient(140deg,#fae3a2,#ffe2ed 45%,#eadcfc)}
.social-symbol.whatsapp{background:#e4f8e9}
.social-symbol.facebook{background:#e5f0ff}
.social-symbol.tiktok{background:#e8ebf0}
.social-symbol.youtube{background:#ffeded}
.social-symbol.x{background:#e7e8eb}
.social-symbol.web{background:#e4f4f1}
.social-name{min-width:0;overflow-wrap:anywhere}
.payment-wrap{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.pay-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 14px 14px 16px;border:1px solid var(--line);border-radius:24px 18px 26px 16px;background:rgba(255,255,255,.66)}
:root[data-estilo="oscuro"] .pay-row{background:rgba(43,34,32,.70)}
.pay-info{min-width:0}
.pay-info small{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.pay-info span{display:block;font-size:14px;font-weight:800;overflow-wrap:anywhere}
.copy{flex:none;border:0;min-height:42px;padding:0 16px;border-radius:999px;background:rgba(122,75,46,.12);color:var(--accent);font-size:12px;font-weight:800;transition:transform .15s ease, background .15s ease}
.copy:hover{background:rgba(122,75,46,.18)}
.copy.ok{background:var(--accent);color:var(--on-accent)}
.copyall{width:100%;margin-top:14px;min-height:54px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);font-weight:800;box-shadow:0 14px 28px rgba(108,63,36,.21)}
.empty{margin-top:10px;color:var(--muted);font-size:13px}
.footer{margin:18px 0 0;padding:0 6px;text-align:center;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.02em}
.thumb-nav{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));z-index:9;transform:translateX(-50%);width:min(94vw,540px);padding:10px;background:rgba(255,255,255,.74);border:1px solid rgba(72,42,24,.10);border-radius:999px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 16px 34px rgba(38,24,18,.18)}
:root[data-estilo="oscuro"] .thumb-nav{background:rgba(25,20,19,.82);border-color:rgba(255,255,255,.08)}
.thumb-nav-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dock-btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 12px;border:0;border-radius:999px;background:rgba(122,75,46,.10);font-size:12px;font-weight:800;color:var(--ink)}
.dock-btn svg{width:18px;height:18px;flex:none}
.dock-btn.active,.dock-btn:hover{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent)}
.visor{position:fixed;inset:0;z-index:50;background:rgba(8,14,12,.95);display:flex;flex-direction:column}
.visor-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));color:#fff;font-weight:800;font-size:14px}
.visor-bar button{padding:9px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;font-weight:800;font-size:13px}
.visor-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 12px max(24px,env(safe-area-inset-bottom))}
.visor-body img{display:block;width:100%;max-width:900px;margin:0 auto 12px;border-radius:10px;background:#fff}
@media(max-width:380px){
  .wrap{padding-left:13px;padding-right:13px}
  .hero{padding:16px 15px 18px}
  .logo{width:72px;height:72px}
  .actions{gap:10px}
  .action-btn{min-height:72px;padding:13px 14px}
  .action-btn.main{min-height:86px}
  .thumb-nav-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .thumb-nav{border-radius:30px;padding:10px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wallpaper" aria-hidden="true"><div class="wallpaper-art" id="fondo"></div></div>
<div class="wash" aria-hidden="true"></div>
<canvas class="cafe-lienzo" id="cafe-lienzo" aria-hidden="true"></canvas>
<main class="wrap">
  <section class="hero" id="top">
    <div class="hero-head">
      <div class="logo" id="logo"></div>
      <div class="hero-copy">
        <div class="badge-row">
          <span class="badge" id="tipo-badge">Menú digital</span>
        </div>
        <h1 id="nombre"></h1>
      </div>
    </div>
    <p class="desc" id="desc"></p>
    <a class="oferta-link" id="oferta-link" href="#" target="_blank" rel="noopener noreferrer" hidden>
      <span class="oferta-copy">
        <span class="oferta-kicker">DESTACADO</span>
        <span class="oferta-titulo" id="oferta-titulo">OFERTAS DEL DÍA</span>
      </span>
    </a>
  </section>

  <section class="thumb-zone" id="acciones-panel">
    <div class="thumb-zone-head">
      <h2>Accesos rápidos</h2>
      <span class="thumb-zone-note">Diseñado para una mano</span>
    </div>
    <div class="actions" id="actions"></div>
    <p class="empty" id="actions-empty" hidden>No hay accesos disponibles en este menú.</p>
  </section>

  <section class="sheet" id="redes-sec" hidden>
    <h3>Síguenos</h3>
    <p class="lead">Toca una red para abrirla rápidamente.</p>
    <div class="social-grid" id="redes"></div>
  </section>

  <section class="sheet" id="pago-sec" hidden>
    <h3>Datos de transferencia</h3>
    <p class="lead">Copias cada dato con un solo toque.</p>
    <div class="payment-wrap" id="pago"></div>
    <button class="copyall" id="copyall">Copiar todos los datos</button>
  </section>

  <div class="footer" id="footer"></div>
</main>

<nav class="thumb-nav" id="thumb-nav" aria-label="Acceso rápido">
  <div class="thumb-nav-list" id="thumb-nav-list">
    <button class="dock-btn active" type="button" data-target="top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10.5V20h14v-9.5"/></svg><span>Inicio</span></button>
    <button class="dock-btn" type="button" data-target="acciones-panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="M8 12h8M8 9h4M8 15h6"/></svg><span>Acciones</span></button>
    <button class="dock-btn" type="button" data-target="redes-sec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10a5 5 0 1 1 10 0c0 5-5 9-5 9s-5-4-5-9Z"/><circle cx="12" cy="10" r="1.5"/></svg><span>Redes</span></button>
    <button class="dock-btn" type="button" data-target="pago-sec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="3"/><path d="M2.5 10.5h19"/></svg><span>Pago</span></button>
  </div>
</nav>

<script>
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

};
const SECTION_ICON = {
  top:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10.5V20h14v-9.5"/></svg>',
  acciones:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="M8 12h8M8 9h4M8 15h6"/></svg>',
  redes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10a5 5 0 1 1 10 0c0 5-5 9-5 9s-5-4-5-9Z"/><circle cx="12" cy="10" r="1.5"/></svg>',
  pago:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="3"/><path d="M2.5 10.5h19"/></svg>'
};
/* Iconos con colores de marca, sin bibliotecas externas. */
const SOCIAL = {
  instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="#C13584" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5.2"/><circle cx="12" cy="12" r="4.05"/><circle cx="17.5" cy="6.6" r="1.2" fill="#F56040" stroke="none"/></svg>',

  if (/whatsapp|wa\.me/.test(k)) return 'whatsapp';
  if (/facebook|fb\.com/.test(k)) return 'facebook';
  if (/tiktok/.test(k)) return 'tiktok';

    celda=Math.ceil(radioBase*2.8);
    maxGranos=Math.min(580,Math.ceil((ancho*alto)/(Math.PI*radioBase*radioBase)*.85));
    if(viejoAncho>1&&viejoAlto>1){
      const diferenciaSuelo=alto-viejoAlto;
      for(const b of granos){
        // En un cambio de barra del navegador, se mueve el suelo, no el mundo:
        // no escalar proporcionalmente la altura (provocaba el salto de la pila).
        if(Math.abs(ancho-viejoAncho)>1){
          b.x=Math.max(b.r,Math.min(ancho-b.r,b.x/viejoAncho*ancho));
        }
        b.y=Math.max(b.r,Math.min(alto-b.r,b.y+diferenciaSuelo));
        limites(b);
      }
    }
    dibujar();
    if(granos.length)activar();
  }

  function programarMedidas(){
    if(!pendienteViewport){
      pendienteViewport=requestAnimationFrame(()=>{
        pendienteViewport=0;
        medidas();
      });
    }
  }

  function crear(){
    if(granos.length>=maxGranos)return;
    const factor=.72+Math.random()*.58;
    const r=Math.round(radioBase*factor);
    const x=r+Math.random()*Math.max(1,ancho-2*r);
    granos.push({x,y:-r-4,vx:(Math.random()-.5)*140+direccion*28,
      vy:35+Math.random()*70,r,invMasa:1/(r*r),variante:Math.floor(Math.random()*4),angulo:Math.random()*Math.PI*2,
      giro:(Math.random()-.5)*5.1});
    ultimoSpawn=performance.now();
    activar();
  }

  function mover(dt){
    const freno=Math.pow(.993,dt*60);
    for(const b of granos){
      b.vy=Math.min(1450,b.vy+G*dt);
      b.vx*=freno;
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      // Rotación visual del grano al caer y frenado progresivo al asentarse.
      b.angulo+=b.giro*dt;
      if(b.y>=alto-b.r-2 && Math.abs(b.vy)<38){
        b.giro*=Math.pow(.88,dt*60);
      } else {
        b.giro*=Math.pow(.997,dt*60);
      }
      limites(b);
    }
    // Cuadrícula espacial: sólo se comparan granos cercanas.
    for(let iter=0;iter<16;iter++){
      const grid=new Map();
      for(let i=0;i<granos.length;i++){
        const b=granos[i];
        const cx=Math.floor(b.x/celda), cy=Math.floor(b.y/celda);
        const k=cx+','+cy;
        if(!grid.has(k))grid.set(k,[]);
        grid.get(k).push(i);
      }
      for(let i=0;i<granos.length;i++){
        const a=granos[i],cx=Math.floor(a.x/celda),cy=Math.floor(a.y/celda);
        for(let gx=cx-1;gx<=cx+1;gx++)for(let gy=cy-1;gy<=cy+1;gy++){
          const indices=grid.get(gx+','+gy);if(!indices)continue;
          for(const j of indices){
            if(j<=i)continue;
            const b=granos[j],dx=b.x-a.x,dy=b.y-a.y,rad=a.r+b.r;
            const dist2=dx*dx+dy*dy;
            if(dist2>=rad*rad)continue;
            let distancia=Math.sqrt(dist2);
            const nx=distancia>0.00001?dx/distancia:1;
            const ny=distancia>0.00001?dy/distancia:0;
            if(!distancia)distancia=.00001;
            const solape=rad-distancia;
            const masa=a.invMasa+b.invMasa;
            const correccion=Math.max(0,solape-.07)*.92/masa;
            a.x-=nx*correccion*a.invMasa;a.y-=ny*correccion*a.invMasa;
            b.x+=nx*correccion*b.invMasa;b.y+=ny*correccion*b.invMasa;
            // Choque con impulso normal y fricción tangencial.
            const vx=b.vx-a.vx,vy=b.vy-a.vy;
            const normal=vx*nx+vy*ny;
            if(normal<0){
              const rest=normal< -65?REBOTE:.02;
              const impulso=-(1+rest)*normal/masa;
              a.vx-=nx*impulso*a.invMasa;a.vy-=ny*impulso*a.invMasa;
              b.vx+=nx*impulso*b.invMasa;b.vy+=ny*impulso*b.invMasa;
              const tx=-ny,ty=nx;
              const tangente=(b.vx-a.vx)*tx+(b.vy-a.vy)*ty;
              const rozamiento=Math.max(-impulso*.10,Math.min(impulso*.10,-tangente/masa));
              a.vx-=tx*rozamiento*a.invMasa;a.vy-=ty*rozamiento*a.invMasa;
              b.vx+=tx*rozamiento*b.invMasa;b.vy+=ty*rozamiento*b.invMasa;
            }
          }
        }
        limites(a);
      }
    }
  }

  function animar(t){
    raf=0;
    if(document.hidden){ultimoFrame=0;return;}
    if(!ultimoFrame)ultimoFrame=t;
    acumulador+=Math.min(.05,(t-ultimoFrame)/1000);ultimoFrame=t;
    let pasos=0;
    while(acumulador>=1/60&&pasos<3){mover(1/60);acumulador-=1/60;pasos++;}
    if(pasos===3)acumulador=0;
    dibujar();
    // Tras el reposo, detenemos el motor sin borrar la pila: ahorra batería.
    if(t-ultimoSpawn>8500){ultimoFrame=0;acumulador=0;return;}
    raf=requestAnimationFrame(animar);
  }
  function activar(){
    if(!raf&&!document.hidden){ultimoFrame=0;raf=requestAnimationFrame(animar);}
  }

  // Usamos gestos reales además del evento scroll: así también nacen granos
  // cuando el usuario sigue deslizando en el final de un menú muy corto.
  function registrarMovimiento(delta){
    if(!delta||reducir.matches||document.body.style.overflow==='hidden')return;
    direccion=delta>0?1:-1;
    const impulso=Math.min(280,Math.abs(delta));
    deuda+=impulso;
    let cantidad=0;
    while(deuda>=35&&cantidad<9&&granos.length<maxGranos){
      crear();deuda-=35;cantidad++;
    }
    // No acumular deuda de movimiento si la pantalla ya está llena.
    if(granos.length>=maxGranos)deuda=0;
  }
  window.addEventListener('wheel',e=>{
    if(e.ctrlKey)return;
    instanteEntrada=performance.now();
    const delta=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?alto:1);
    registrarMovimiento(delta);
  },{passive:true});
  window.addEventListener('touchstart',e=>{
    toqueAnterior=e.touches.length===1?e.touches[0].clientY:null;
  },{passive:true});
  window.addEventListener('touchmove',e=>{
    if(e.touches.length!==1||toqueAnterior===null)return;
    const actual=e.touches[0].clientY;
    instanteEntrada=performance.now();
    registrarMovimiento(toqueAnterior-actual);
    toqueAnterior=actual;
  },{passive:true});
  window.addEventListener('touchend',()=>toqueAnterior=null,{passive:true});
  window.addEventListener('touchcancel',()=>toqueAnterior=null,{passive:true});
  window.addEventListener('scroll',()=>{
    const nuevo=window.scrollY||0,delta=nuevo-anteriorScroll;
    anteriorScroll=nuevo;
    if(performance.now()-instanteEntrada>170)registrarMovimiento(delta);
  },{passive:true});
  window.addEventListener('resize',programarMedidas,{passive:true});
  window.addEventListener('orientationchange',programarMedidas,{passive:true});
  // iOS Safari y Chrome Android no siempre emiten resize de window por las
  // barras flotantes; estos eventos sí reflejan el área visible real.
  if(viewportVisual){
    viewportVisual.addEventListener('resize',programarMedidas,{passive:true});
    viewportVisual.addEventListener('scroll',programarMedidas,{passive:true});
  }
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&granos.length)activar();});
  if(reducir.addEventListener)reducir.addEventListener('change',()=>{
    if(reducir.matches){if(raf)cancelAnimationFrame(raf);raf=0;ctx.clearRect(0,0,ancho,alto);}
    else {dibujar();activar();}
  });
  medidas();
})();

/* Carga los datos del negocio:
   menu.html?d=...   -> los datos vienen dentro del link (no hay que subir nada)
   menu.html?n=slug  -> los datos se leen de datos/slug.json */
const P = new URLSearchParams(location.search);
const slug = P.get('n') || '', cod = P.get('d');
function noEncontrada(detalle){
  $('logo').hidden = true;
  $('nombre').textContent = 'Página no encontrada';
  $('desc').textContent = 'Revisa el link o vuelve a escanear el código QR.' + (detalle ? ' (' + detalle + ')' : '');
}
function decodificar(t){
  t = t.replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '=';
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(t), c => c.charCodeAt(0))));
}
if (cod){
  try { render(decodificar(cod)); } catch(e){ noEncontrada('el link está incompleto o dañado'); }
} else if (/^[a-z0-9-]+$/i.test(slug)){
  fetch('datos/' + slug + '.json', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('no se encontró datos/' + slug + '.json'); return r.json(); })
    .then(render).catch(e => noEncontrada(e.message));
} else noEncontrada('el link no incluye los datos del negocio');

</script>
