<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carta digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#16211D; --muted:#66736D; --line:#DFE5E2;
  --accent:#0F766E; --on-accent:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1513; --surface:#18201D; --ink:#EAF0ED; --muted:#93A19A; --line:#27312D; color-scheme:dark;}
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding:32px 20px 56px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

/* Cabecera */
.logo{width:56px;height:56px;border-radius:16px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:24px;font-weight:800;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
h1{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:18px}
.desc{color:var(--muted);margin-top:8px;max-width:38ch}

/* Botones de acción */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 14px;border-radius:14px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--surface);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn svg{width:18px;height:18px;flex:none}
.actions .btn:only-child,.actions .btn.big{grid-column:1/-1}
.btn.big{padding:18px 14px;font-size:17px;border-radius:16px}

/* Redes */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.chips .btn{padding:10px 16px;border-radius:99px}

/* Transferencia */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 18px;margin-top:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row small{display:block;color:var(--muted);font-size:12px}
.row span{font-weight:700;word-break:break-all}
.copy{flex:none;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:700}
.copy.ok{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.copyall{width:100%;margin-top:12px}

footer{margin-top:40px;text-align:center;color:var(--muted);font-size:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="wrap">
  <div class="logo" id="logo"></div>
  <h1 id="nombre"></h1>
  <p class="desc" id="desc"></p>

  <div class="actions" id="actions"></div>

  <section id="redes-sec" hidden>
    <h2>Síguenos</h2>
    <div class="chips" id="redes"></div>
  </section>

  <section id="pago-sec" hidden>
    <h2>Datos de transferencia</h2>
    <div class="card" id="pago"></div>
    <button class="btn copyall" id="copyall">Copiar todos los datos</button>
  </section>

  <footer id="footer"></footer>
</main>

<script>
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const ICON = {
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v17H6a2 2 0 0 0-2 2z"/><path d="M4 20V5"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>'
};

const svg = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
const SOCIAL = {
  instagram: svg('<rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><path d="M17.5 6.5h.01"/>'),
  whatsapp:  svg('<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/><path d="M9 8.5c0 3 2.5 5.5 5.5 5.5l1-1.3-1.8-1-.8.7a3 3 0 0 1-1.6-1.6l.7-.8-1-1.8z"/>'),
  facebook:  svg('<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>'),
  tiktok:    svg('<path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.4 2.4 2 4 4.5 4.2"/>'),
  youtube:   svg('<path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><path d="M9.75 15.02 15.5 11.75 9.75 8.48z"/>'),
  x:         svg('<path d="M4 4l16 16M20 4L4 20"/>'),
  web:       svg('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>')
};
function iconoRed(r){
  const k = (r.nombre + ' ' + r.url).toLowerCase();
  if (/instagram/.test(k)) return SOCIAL.instagram;
  if (/whatsapp|wa\.me/.test(k)) return SOCIAL.whatsapp;
  if (/facebook|fb\.com/.test(k)) return SOCIAL.facebook;
  if (/tiktok/.test(k)) return SOCIAL.tiktok;
  if (/youtube|youtu\.be/.test(k)) return SOCIAL.youtube;
  if (/twitter|x\.com/.test(k)) return SOCIAL.x;
  return SOCIAL.web;
}

function toast(btn){
  const old = btn.textContent;
  btn.textContent = '¡Copiado!'; btn.classList.add('ok');
  setTimeout(() => { btn.textContent = old; btn.classList.remove('ok'); }, 1400);
}
async function copiar(texto, btn){
  try { await navigator.clipboard.writeText(texto); }
  catch(e){ // respaldo para navegadores sin permiso de portapapeles
    const t = document.createElement('textarea'); t.value = texto; t.style.position='fixed'; t.style.opacity='0';
    document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
  }
  toast(btn);
}

function render(C){
C.redes = C.redes || []; C.transferencia = C.transferencia || {};
/* Cabecera */
document.title = C.nombre + ' · Carta';
if (C.acento) document.documentElement.style.setProperty('--accent', C.acento);
$('nombre').textContent = C.nombre;
$('desc').textContent = C.descripcion;
if (C.logo){ const i = el('img'); i.src = C.logo; i.alt = ''; $('logo').appendChild(i); }
else $('logo').textContent = C.nombre.charAt(0).toUpperCase();

/* Botones principales */
function accion(texto, url, icono, main, big){
  const a = el('a', 'btn' + (main ? ' main' : '') + (big ? ' big' : ''));
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  a.innerHTML = icono; a.appendChild(document.createTextNode(texto));
  $('actions').appendChild(a);
}
if (C.cartaUrl) accion('Ver carta', C.cartaUrl, ICON.book, true, true);
if (C.mapsUrl) accion('Cómo llegar', C.mapsUrl, ICON.pin);
if (C.resenaUrl) accion('Dejar reseña', C.resenaUrl, ICON.star);
if (!$('actions').children.length) $('actions').hidden = true;

/* Redes */
if (C.redes.length){
  $('redes-sec').hidden = false;
  C.redes.forEach(r => {
    const a = el('a', 'btn'); a.href = r.url; a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = iconoRed(r); a.appendChild(document.createTextNode(r.nombre));
    $('redes').appendChild(a);
  });
}

/* Transferencia */
const datos = Object.entries(C.transferencia).filter(([, v]) => v);
if (datos.length){
  $('pago-sec').hidden = false;
  datos.forEach(([k, v]) => {
    const row = el('div', 'row'), info = el('div');
    info.appendChild(el('small', null, k)); info.appendChild(el('span', null, v));
    const b = el('button', 'copy', 'Copiar'); b.type = 'button';
    b.setAttribute('aria-label', 'Copiar ' + k);
    b.onclick = () => copiar(v, b);
    row.appendChild(info); row.appendChild(b); $('pago').appendChild(row);
  });
  $('copyall').onclick = e => copiar(datos.map(([k, v]) => k + ': ' + v).join('\n'), e.currentTarget);
}

$('footer').textContent = 'Carta digital · ' + C.nombre;
}

/* Carga los datos del negocio según el link: menu.html?n=nombre-del-negocio */
const slug = new URLSearchParams(location.search).get('n') || '';
function noEncontrada(){
  $('logo').hidden = true;
  $('nombre').textContent = 'Carta no encontrada';
  $('desc').textContent = 'Revisa el link o vuelve a escanear el código QR.';
}
if (/^[a-z0-9-]+$/i.test(slug)){
  fetch('datos/' + slug + '.json', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(); return r.json(); })
    .then(render).catch(noEncontrada);
} else noEncontrada();
</script>
</body>
</html>
